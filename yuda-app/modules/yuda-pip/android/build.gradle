plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.mieayamproject.yuda.pip'
version = '1.0.0'

android {
  namespace "com.mieayamproject.yuda.pip"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
  sourceSets {
    main {
      assets.srcDirs += [file("../../../assets")]
    }
  }
}

dependencies {
  implementation 'com.facebook.react:react-android'
}

